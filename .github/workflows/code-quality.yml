name: 'コード品質検証 (Code Quality)'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: '共通品質チェック実行 (Execute Base CI)'
    uses: masanori-satake/common-workflows/.github/workflows/base-ci.yml@v1
    with:
      # Vanilla JS プロジェクトのため型チェックは不要
      run_typecheck: false
    # 統一パラメータ（Node=lts/*, Python=3.12, lockfile 自動判定, scripts/ci_checks.py 実行）は
    # base 側のデフォルトに閉じ込められているため、その他の with: は不要。
